{
  "//": "UnipolyChain (UNPChain) public FULL NODE config — non-mining, safe defaults.",
  "//paths": "Paths are relative to the `node/` directory of this repo. Run Nethermind with:  ./nethermind --config node/config/unpchain-node.cfg  (from a build that bundles this chain), OR use node/docker-compose.yml which does not need this file.",
  "Init": {
    "WebSocketsEnabled": true,
    "StoreReceipts": true,
    "EnableUnsecuredDevWallet": false,
    "IsMining": false,
    "ChainSpecPath": "chainspec.json",
    "BaseDbPath": "nethermind_db/unpchain",
    "LogFileName": "unpchain.log",
    "StaticNodesPath": "Data/static-nodes.json"
  },
  "Blocks": {
    "MinGasPrice": 0
  },
  "Logging": {
    "ConsoleLogLevels": {
      "Default": "Info"
    },
    "FileLogLevels": {
      "Default": "Info"
    }
  },
  "Network": {
    "DiscoveryPort": 30303,
    "P2PPort": 30303,
    "LocalIp": "0.0.0.0",
    "ExternalIp": "0.0.0.0",
    "MaxActivePeers": 50
  },
  "JsonRpc": {
    "Enabled": true,
    "Host": "0.0.0.0",
    "Port": 8545,
    "EnabledModules": [
      "Eth",
      "Net",
      "Web3",
      "Subscribe",
      "TxPool",
      "Clique",
      "Health"
    ]
  },
  "Merge": {
    "Enabled": false
  }
}
