# UnipolyChain (UNPChain) — public full node.
#
# This runs a NON-mining, fully-syncing node of the live network. Anyone can run it —
# there is no approval, no whitelist, no permission needed. Just:
#
#     git clone https://github.com/Mohammadali-Ghods/UnipolyChainNode.git
#     cd UnipolyChainNode/node
#     docker compose up -d --build
#
# The first `--build` compiles the exact same node software the network's validator runs
# (so the chain-id / genesis / networkId match perfectly and your node will sync). It takes
# a few minutes the first time; after that `docker compose up -d` is instant.
#
# Watch it sync:   docker compose logs -f
# JSON-RPC:        http://<your-server-ip>:8545

name: unpchain-node

services:
  unpchain-node:
    build:
      context: ..          # repo root (contains the Dockerfile that builds the node)
      dockerfile: Dockerfile
    image: unpchainnode:latest
    container_name: unpchain-node
    restart: unless-stopped
    stop_grace_period: 3m
    command:
      # Use the network's built-in chain configuration (chainId 47382916 / UNPChain genesis).
      - --config
      - mainnet
      # A public node validates & relays blocks — it does NOT seal them, so mining is OFF.
      - --Init.IsMining
      - "false"
      # Do not expose an unsecured dev wallet on a public node.
      - --Init.EnableUnsecuredDevWallet
      - "false"
      # Bootstrap: connect to the public bootnode to discover the rest of the network.
      - --Network.StaticPeers
      - "enode://1e9863365795ea0cb16f4c524694a28e37a9b35a411965bb152a62c63735e6531af7cca65e3c8faeb6049a94535ba9516df2616411142e0d5143de001f075705@167.86.100.150:30304"
      - --Network.MaxActivePeers
      - "50"
      # ---- OPTIONAL: uncomment and set your server's PUBLIC IP so other nodes can dial you.
      # - --Network.ExternalIp
      # - "203.0.113.10"
      # ---- JSON-RPC (safe read/consensus modules). Restrict / firewall port 8545 in production.
      - --JsonRpc.Enabled
      - "true"
      - --JsonRpc.Host
      - "0.0.0.0"
      - --JsonRpc.Port
      - "8545"
      - --JsonRpc.EnabledModules
      - "Eth,Net,Web3,Subscribe,TxPool,Clique,Health"
    ports:
      - "8545:8545"          # JSON-RPC   (firewall this to trusted IPs in production)
      - "30303:30303/tcp"    # devp2p     (open this to the internet to accept inbound peers)
      - "30303:30303/udp"    # discovery
    volumes:
      - unpchain-data:/nethermind/nethermind_db   # blockchain database survives restarts

volumes:
  unpchain-data:
